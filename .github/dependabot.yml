# Dependabot — kontinuierliche, serverseitige Dependency-Überwachung.
# Ergänzt den wöchentlichen lokalen Security-Scan (npm audit) um Echtzeit-CVE-PRs
# und deckt zusätzlich die GitHub-Actions-Versionen ab (die npm audit nie sieht).
#
# Hinweis: Damit Dependabot auch SICHERHEITS-Updates (CVE-getrieben) automatisch
# als PR öffnet, müssen in GitHub unter Settings → Code security zusätzlich
# "Dependabot alerts" und "Dependabot security updates" aktiviert sein — das ist
# ein Repo-Setting, keine Datei. Diese Datei steuert die Versions-Update-PRs.
#
# Falls die Versions-Update-PRs sich zu sehr mit dem wöchentlichen Auto-Patch der
# Routine überschneiden: interval auf "monthly" stellen oder die beiden npm-Blöcke
# entfernen und nur den github-actions-Block behalten (den deckt sonst nichts ab).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # better-sqlite3 v13 wird von @prisma/adapter-better-sqlite3 noch nicht
      # unterstuetzt (verlangt hart ^12.x) - siehe TODO.md. Entfernen, sobald
      # Prisma v13 freigibt. Minor/Patch-Updates innerhalb v12 kommen weiter.
      - dependency-name: "better-sqlite3"
        update-types: ["version-update:semver-major"]
    groups:
      backend-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # @vitejs/plugin-react ab 6.2 zieht ueber die optionale Peer-Kette
      # @rolldown/plugin-babel -> @babel/plugin-transform-runtime@8 eine
      # Anforderung @babel/core ^8 nach; im Projekt steckt @babel/core 7
      # (u. a. ueber workbox-build) -> npm install endet mit ERESOLVE.
      # Ohne diese Ausnahme waere jeder frontend-minor-patch-Gruppen-PR
      # blockiert. Entfernen, sobald `npm install @vitejs/plugin-react@latest
      # --dry-run` im Frontend ohne ERESOLVE durchlaeuft (prueft die
      # woechentliche Security-Routine). Zurueckgestellt seit 2026-11-02.
      - dependency-name: "@vitejs/plugin-react"
        versions: [">=6.2.0"]
    groups:
      frontend-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
