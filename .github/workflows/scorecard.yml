name: Scorecard

# OpenSSF Scorecard: bewertet die Supply-Chain-Hygiene des Repos und
# veroeffentlicht das Ergebnis (publish_results), damit
# api.securityscorecards.dev Daten fuer den woechentlichen Security-Scan liefert.
# Ergebnisse zusaetzlich als SARIF im Code-Scanning-Tab.
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  # Fuer den Branch-Protection-Check
  branch_protection_rule:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write   # SARIF-Upload ins Code Scanning
      id-token: write          # OIDC fuer publish_results
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
