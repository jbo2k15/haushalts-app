server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;

    # Echte Client-IP hinter dem Cloudflare Tunnel: cloudflared laeuft auf dem
    # Docker-Host und verbindet sich mit localhost:80, d.h. jede Verbindung kommt
    # vom Docker-Gateway (172.18.0.1). Nur von dort wird der Header
    # CF-Connecting-IP (von Cloudflare gesetzt) als Client-IP uebernommen -
    # $remote_addr ist danach die echte IP, und die proxy_set_header-Zeilen unten
    # reichen sie per X-Forwarded-For an Express (Rate-Limiter, Login-Log) weiter.
    # Direkte Zugriffe aus dem LAN (192.168.x) koennen den Header so nicht
    # faelschen. 172.16.0.0/12 deckt die Docker-Standard-Netze ab, falls das
    # Compose-Netz einmal mit anderem Subnetz neu angelegt wird.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header CF-Connecting-IP;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript text/xml application/xml;
    gzip_min_length 1000;
    gzip_comp_level 6;
    gzip_vary on;

    # Security-Header (inkl. CSP + HSTS) - siehe security-headers.inc.
    # Jeder location-Block mit eigenem add_header muss die Datei erneut
    # einbinden, sonst fallen die Header dort weg (nginx-Vererbungsregel).
    include /etc/nginx/security-headers.inc;

    # SSE endpoint: strip ?token= from nginx access log to avoid JWT leakage
    location = /api/events {
        proxy_pass http://backend:3001/api/events;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (not append) so a client-supplied X-Forwarded-For can't
        # spoof the IP that Express's rate limiter keys on (trust proxy = 1 hop).
        # $remote_addr ist dank real_ip (oben) die echte Client-IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Required for SSE streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        access_log off;
    }

    location /api/ {
        proxy_pass http://backend:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (not append) so a client-supplied X-Forwarded-For can't
        # spoof the IP that Express's rate limiter keys on (trust proxy = 1 hop).
        # $remote_addr ist dank real_ip (oben) die echte Client-IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Service Worker, manifest and the unhashed theme-init.js must never be cached so updates are detected immediately
    location ~* (sw\.js|workbox-[^.]+\.js|manifest\.webmanifest|theme-init\.js)$ {
        try_files $uri =404;
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
    }

    # index.html must not be cached so the browser always fetches the latest entry point
    location = /index.html {
        try_files $uri =404;
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
    }

    # Hashed assets can be cached indefinitely
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|js|css)$ {
        try_files $uri =404;
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
